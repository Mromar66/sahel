name: safwa
description: "Offline Inventory & Accounting Desktop Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.7

  # Database - SQLite + Drift
  sqlite3_flutter_libs: ^0.5.21
  drift: ^2.23.0
  sqlite3: ^2.4.0
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.3

  # Immutable data models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Charts
  fl_chart: ^0.69.0

  # PDF generation & printing
  pdf: ^3.11.1
  printing: ^5.13.0

  # Localization & Arabic support
  intl: ^0.19.0
  cryptography: 2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Database code generation
  drift_dev: ^2.23.0
  build_runner: ^2.4.13

  # Freezed code generation
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/products/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
